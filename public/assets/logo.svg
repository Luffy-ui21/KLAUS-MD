<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Outer aura glow — pulsing green/emerald gradient -->
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:0.9" />
      <stop offset="40%" style="stop-color:#22c55e;stop-opacity:0.7" />
      <stop offset="70%" style="stop-color:#16a34a;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:0" />
    </radialGradient>

    <!-- Main logo gradient -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4ade80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>

    <!-- Inner ring gradient -->
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#86efac;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background — pure black -->
  <rect width="200" height="200" fill="#000000"/>

  <!-- Outer aura glow -->
  <circle cx="100" cy="100" r="100" fill="url(#aura)" opacity="0.8">
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Aura rays — radiating lines -->
  <g opacity="0.4" filter="url(#glow2)">
    <line x1="100" y1="20" x2="100" y2="35" stroke="#4ade80" stroke-width="2"/>
    <line x1="100" y1="165" x2="100" y2="180" stroke="#4ade80" stroke-width="2"/>
    <line x1="20" y1="100" x2="35" y2="100" stroke="#4ade80" stroke-width="2"/>
    <line x1="165" y1="100" x2="180" y2="100" stroke="#4ade80" stroke-width="2"/>
    <line x1="44" y1="44" x2="55" y2="55" stroke="#4ade80" stroke-width="2"/>
    <line x1="145" y1="145" x2="156" y2="156" stroke="#4ade80" stroke-width="2"/>
    <line x1="44" y1="156" x2="55" y2="145" stroke="#4ade80" stroke-width="2"/>
    <line x1="145" y1="55" x2="156" y2="44" stroke="#4ade80" stroke-width="2"/>
  </g>

  <!-- Outer ring (pulsing) -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="url(#ring)" stroke-width="3" filter="url(#glow)">
    <animate attributeName="r" values="78;82;78" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Inner ring -->
  <circle cx="100" cy="100" r="68" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.5"/>

  <!-- Inner solid circle -->
  <circle cx="100" cy="100" r="62" fill="url(#grad)" filter="url(#glow)"/>

  <!-- Inner darker circle for depth -->
  <circle cx="100" cy="100" r="56" fill="#0a1f0a" opacity="0.4"/>

  <!-- Decorative stars -->
  <g fill="white" opacity="0.7">
    <circle cx="40" cy="50" r="1"/>
    <circle cx="160" cy="50" r="1.5"/>
    <circle cx="30" cy="100" r="1"/>
    <circle cx="170" cy="100" r="1"/>
    <circle cx="50" cy="155" r="1.5"/>
    <circle cx="150" cy="155" r="1"/>
  </g>

  <!-- "B" letter — bold -->
  <text x="100" y="135" text-anchor="middle"
        font-family="Arial Black, Arial, sans-serif"
        font-size="80" font-weight="900"
        fill="white"
        filter="url(#glow)">B</text>

  <!-- MD text -->
  <text x="100" y="165" text-anchor="middle"
        font-family="Arial Black, Arial, sans-serif"
        font-size="18" font-weight="800"
        fill="white" letter-spacing="2">MD</text>
</svg>
