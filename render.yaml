# Render Blueprint for your custom WhatsApp bot
# Docs: https://render.com/docs/blueprint-spec
# After pushing this repo to GitHub/GitLab, go to:
#   New → Blueprint → connect repo → Render reads this file.

services:
  - type: web
    name: klaus-md
    runtime: docker
    plan: free            # change to 'starter' for always-on
    region: frankfurt     # pick the region closest to your WhatsApp users
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SESSION_ID
        sync: false       # set this in the Render dashboard after first QR scan
      - key: BOT_NAME
        value: KLAUS-MD
      - key: OWNER_NUMBER
        value: 254711815459
      - key: BOT_PREFIX
        value: .
      - key: BOT_MODE
        value: public
      - key: BOT_TIMEZONE
        value: Africa/Nairobi
      - key: DATABASE_URL
        sync: false       # optional — only if you wire up Postgres
      - key: XWOLF_API_KEY
        value: wxa_u_xwk7sch6xj
      - key: NODE_ENV
        value: production
